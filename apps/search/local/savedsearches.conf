[test]
action.email.useNSSubject = 1
action.rfes_ar_links.param.risk = 0
action.webhook.enable_allowlist = 0
alert.track = 0
cron_schedule = 28 12 * * *
enableSched = 1
search = index=_internal | head 1\
| stats count by sourcetype\
| collect index=test

[test1]
action.webhook = 1
action.webhook.param.url = https://webhook.site/e1f8033d-7792-455b-b557-ed40dd92965b
actions = webhook
alert.digest_mode = 1
alert.track = 1
counttype = always
cron_schedule = */5 * * * *
disabled = 0
enableSched = 0
is_visible = 1
search = | makeresults | eval event_type="splunk_webhook_test", status="success", message="test1 webhook payload", sent_at=strftime(_time, "%Y-%m-%dT%H:%M:%S%z") | table event_type status message sent_at
