# Splunk's SPL parser tokenizes normalize_unicode_fields as the base command
# "normalize" followed by the underscore suffix. Both stanzas point to the
# same implementation so the requested SPL spelling works across parser paths.
[normalize]
filename = normalize_unicode_fields.py
python.version = python3.9
chunked = false
supports_getinfo = false
enableheader = true
outputheader = true
supports_multivalues = true
supports_rawargs = false
streaming = true
retainsevents = true
local = true
run_in_preview = false

[normalize_unicode_fields]
filename = normalize_unicode_fields.py
python.version = python3.9
chunked = false
supports_getinfo = false
enableheader = true
outputheader = true
supports_multivalues = true
supports_rawargs = false
streaming = true
retainsevents = true
local = true
run_in_preview = false
